name = neuralDspPluginsAccessibility
summary = "Neural DSP Plugins Accessibility"
description = """Makes the Neural DSP Archetype Petrucci X and Archetype Nolly X guitar plug-ins usable with NVDA. It names their controls, says knob values and switch positions, and adds keys for switching sections, stepping through presets, the tuner and level checks. Works best with the VST3 plug-ins inside REAPER; the standalone applications are still being worked on and tested."""
