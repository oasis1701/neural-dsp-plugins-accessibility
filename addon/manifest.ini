name = neuralDspPluginsAccessibility
summary = "Neural DSP Plugins Accessibility"
description = """Makes Neural DSP amplifier plugins usable with NVDA, both as standalone applications and as VST3 plug-ins inside a host such as REAPER. Currently covers the Mesa Boogie Mark IIC+ Suite, the Archetype Petrucci X and the Archetype Nolly X.

The amplifiers already support Tab focus movement and report their controls to the accessibility system, but leave names blank or hidden, so NVDA has nothing to announce. This add-on supplies the missing names, speaks knob values in useful units, reads switch positions, and lets you adjust knobs with the arrow keys.

It also solves the amplifiers' habit of taking keyboard focus without giving it to any component, which leaves their own Tab handling with nothing to move on from. In a standalone that is done automatically when the window comes forward. In a plug-in it is deliberate, with NVDA+shift+F, because the host's own controls are somewhere you legitimately want to be - and the same key steps back out, which matters because an amplifier's Tab ring is cyclic and has no exit of its own."""
author = "Hadi"
url = https://github.com/oasis1701/neural-dsp-plugins-accessibility
version = 0.13.0
docFileName = readme.html
minimumNVDAVersion = 2024.1
lastTestedNVDAVersion = 2026.3.1
